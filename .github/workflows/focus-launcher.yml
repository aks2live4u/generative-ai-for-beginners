name: Build Focus Launcher APK

on:
  push:
    paths:
      - 'FocusLauncher/**'
      - '.github/workflows/focus-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FocusLauncher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: focus-launcher-apk
          path: FocusLauncher/app/build/outputs/apk/debug/*.apk
