name: Build Not Now APK

on:
  push:
    branches:
      - claude/not-now-guardrail-app-4EM3p
    paths:
      - 'not-now-app/**'
  workflow_dispatch:   # also lets you trigger it manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x not-now-app/gradlew

      - name: Build debug APK
        run: |
          cd not-now-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-now-debug-apk
          path: not-now-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
