<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d92c2c">
  <title>YouTube to MP3</title>
  <style>
    :root { --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #d92c2c; --border: #d2d2d7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --border: #3a3a3c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           padding: 16px; background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--card); border-radius: 16px; padding: 24px;
           box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .9rem; }
    input, select { width: 100%; font-size: 1rem; padding: 14px; border-radius: 10px;
                    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    button { font-size: 1rem; padding: 14px 16px; border-radius: 10px; border: 0; cursor: pointer; }
    .paste { background: var(--border); color: var(--text); }
    .go { width: 100%; margin-top: 20px; background: var(--accent); color: #fff; font-weight: 600; }
    .go:disabled { opacity: .6; }
    .error { background: #fde8e8; color: #9b1c1c; padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: .9rem; word-break: break-word; }
    .status { display: none; margin-top: 14px; color: var(--muted); font-size: .9rem; text-align: center; }
    .note { margin-top: 20px; font-size: .75rem; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>YouTube &rarr; MP3</h1>
  <p class="sub">Paste a link. The MP3 is saved to your phone's Downloads folder.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form id="form" method="post" action="/download">
    <label for="url">YouTube link</label>
    <div class="row">
      <input id="url" name="url" type="url" inputmode="url" required
             placeholder="https://youtu.be/..." value="{{ url or '' }}">
      <button type="button" class="paste" id="paste">Paste</button>
    </div>

    <label for="bitrate">Quality</label>
    <select id="bitrate" name="bitrate">
      <option value="128">128 kbps (smaller file)</option>
      <option value="192" selected>192 kbps (recommended)</option>
      <option value="320">320 kbps (best)</option>
    </select>

    <button class="go" id="go" type="submit">Download MP3</button>
    <div class="status" id="status">Downloading and converting&hellip; this can take a minute.<br>Your download will start automatically.</div>
  </form>

  <p class="note">Only download videos you own or have permission to download.</p>
</main>
<script>
  // Fill the box from the clipboard (needs HTTPS or localhost on most browsers).
  document.getElementById('paste').addEventListener('click', async () => {
    try { document.getElementById('url').value = (await navigator.clipboard.readText()).trim(); }
    catch (e) { document.getElementById('url').focus(); }
  });

  // Show progress while the server works; re-enable the button once the file arrives.
  document.getElementById('form').addEventListener('submit', () => {
    const go = document.getElementById('go');
    go.disabled = true;
    go.textContent = 'Working…';
    document.getElementById('status').style.display = 'block';
    setTimeout(() => { go.disabled = false; go.textContent = 'Download MP3'; }, 15000);
  });
</script>
</body>
</html>
